[package]
name = "abandon-ship-server"
version = "0.1.0"
edition = "2021"
description = "Sidecar for captaind: pays expired, unrefreshed Ark coins on-chain to the coin's own key"
license = "MIT"

[dependencies]
# This comparison branch uses the matching local captaind patch.
ark-lib = { path = "../abandon-ship-bark-captaind-api/lib" }
bark-server-rpc = { path = "../abandon-ship-bark-captaind-api/server-rpc", default-features = false, features = ["tonic-native"] }
bitcoin = "0.32.7"
bitcoincore-rpc = "0.19"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
bip39 = "2"
