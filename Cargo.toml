[package]
name = "abandon-ship-server"
version = "0.1.0"
edition = "2021"
description = "Sidecar for captaind: pays expired, unrefreshed Ark coins on-chain to the coin's own key"
license = "MIT"

[dependencies]
# Pinned to the captaind commit we target (bark master 6768e0fb4 = nightly-2026-10-01 images; lib/server identical to 8c29e300c).
ark-lib = { git = "https://gitlab.com/ark-bitcoin/bark.git", rev = "6768e0fb4f4f58bbacd0efafc979a119c58f3311" }
bitcoin = "0.32.7"
bitcoincore-rpc = "0.19"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
bip39 = "2"
