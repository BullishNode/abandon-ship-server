[package]
name = "abandon-ship-server"
version = "0.1.0"
edition = "2021"
description = "Sidecar for captaind: pays expired, unrefreshed Ark coins on-chain to the coin's own key"
license = "MIT"

[dependencies]
# Generated admin client from the published captaind comparison patch.
ark-lib = { git = "https://github.com/BullishNode/bark", rev = "5848679f84ac0efc67b3d7b2b618aa516e38450f" }
bark-server-rpc = { git = "https://github.com/BullishNode/bark", rev = "5848679f84ac0efc67b3d7b2b618aa516e38450f", default-features = false, features = ["tonic-native"] }
bitcoin = "0.32.7"
bitcoincore-rpc = "0.19"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
bip39 = "2"
