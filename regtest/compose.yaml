# Regtest stack for abandon-ship-server. Test-only credentials.
# Images: captaind/bark nightly-2026-10-01 = bark master 6768e0fb4.
name: abandon-regtest

services:
  bitcoind:
    image: bitcoin/bitcoin@sha256:a1d05be6939b5c85132a761d2b795f5b8a2612ce53782263da4939778e461792  # Core 31.0
    command: [bitcoind, -regtest, -server, -printtoconsole, -rpcbind=0.0.0.0, -rpcallowip=0.0.0.0/0, -rpcuser=second, -rpcpassword=ark,
      # least-privilege sidecar user (docs/deployment.md); password sidecar-regtest
      "-rpcauth=sidecar:abandonregtestsalt0001$$fab883b19a2762091b80f822ef7aa47145d904d95e9b2077aca860d4053be676",
      -rpcwhitelistdefault=0,
      "-rpcwhitelist=sidecar:getwalletinfo,getblockcount,estimatesmartfee,getrawtransaction,gettxout,getaddressinfo,walletcreatefundedpsbt,walletprocesspsbt,finalizepsbt,sendrawtransaction",
      -txindex, -blockfilterindex, -coinstatsindex]
    volumes: ["bitcoin:/home/bitcoin/.bitcoin"]
    ports: ["127.0.0.1:48443:18443"]
    healthcheck:
      test: [CMD, bitcoin-cli, -regtest, -rpcuser=second, -rpcpassword=ark, getblockchaininfo]
      interval: 3s
      retries: 30

  postgres:
    image: postgres@sha256:da788743d2060767375896de4d646f7576f5911461444b372616f19ea61db2ec
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abandon-regtest
    volumes: ["postgres:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:45432:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres"]
      interval: 3s
      retries: 30

  cln:
    restart: unless-stopped
    image: secondark/cln-hold@sha256:d39a7befb75611a76002a5c2e75c8d9d3be9796c68d0bb1148de98f1dbe7add1
    hostname: cln
    entrypoint: [/bin/sh, -c, "mkdir -p /root/.lightning/regtest && exec /root/cln/start.sh"]
    volumes: ["cln:/root/.lightning"]
    depends_on:
      bitcoind: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "lightning-cli --regtest getinfo >/dev/null && test -f /root/.lightning/regtest/generation.done"]
      interval: 5s
      retries: 60

  captaind:
    restart: unless-stopped
    image: secondark/captaind@sha256:9414f43b7de5ce4a806380d6ece719f73c8c1167ad2f40ccbd0ba6e30789c292
    environment:
      CAPTAIND_LOG: info
    entrypoint: [/bin/sh, /scripts/start-captaind.sh]
    volumes:
      - captaind:/data/captaind
      - cln:/data/cln:ro
      - ./captaind.toml:/config/captaind.toml:ro
      - ./scripts:/scripts:ro
    ports: ["127.0.0.1:43535:3535"]
    depends_on:
      bitcoind: {condition: service_healthy}
      postgres: {condition: service_healthy}
      cln: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "captaind --config /config/captaind.toml rpc wallet >/dev/null"]
      interval: 5s
      retries: 60

  watchmand:
    restart: unless-stopped
    image: secondark/captaind@sha256:9414f43b7de5ce4a806380d6ece719f73c8c1167ad2f40ccbd0ba6e30789c292
    environment:
      WATCHMAND_LOG: info
    entrypoint: [/bin/sh, /scripts/start-watchmand.sh]
    volumes:
      - captaind:/data/captaind:ro
      - watchmand:/data/watchmand
      - ./watchmand.toml:/config/watchmand.toml:ro
      - ./scripts:/scripts:ro
    depends_on:
      captaind: {condition: service_healthy}

  # Bark CLI wallets (u1, u2, ...) live in the `wallets` volume; run with
  #   docker compose run --rm bark --datadir /wallets/u1 <cmd>
  bark:
    image: secondark/bark@sha256:eb056e4cf3f2e92f1166573befdadf2ff9430b2fb18acd14e73058e08c768ec4
    entrypoint: [bark]
    volumes: ["wallets:/wallets"]
    profiles: [cli]

  # barkd of the bark fork (variant-b) for bark-web, profile web:
  #   docker compose --profile web up -d barkd     (API on 127.0.0.1:43000, no auth)
  barkd:
    image: abandon-ship/bark:variant-b
    command: [barkd, --host, 0.0.0.0, --port, "3000", --dangerously-allow-remote-no-auth]
    volumes: ["barkd:/root/.bark"]
    ports: ["127.0.0.1:43000:3000"]
    depends_on:
      captaind: {condition: service_healthy}
    profiles: [web]

volumes:
  bitcoin:
  postgres:
  cln:
  captaind:
  watchmand:
  wallets:
  barkd:
