# Copy to config.toml (git-ignored). Values below are regtest examples.
network = "regtest"
journal_path = "/var/lib/abandon-ship/payouts.journal"  # local disk, back up separately
captaind_url = "http://127.0.0.1:3536" # existing private admin listener
poll_interval_secs = 10   # seconds between ticks

[postgres]
# The sidecar's independent state database.
conninfo = "host=127.0.0.1 port=5432 user=postgres password=<secret> dbname=abandon-ship"

[bitcoind]
# Dedicated payout wallet, with the node's RPC credentials.
url = "http://127.0.0.1:38443/wallet/payout"
user = "<rpcuser>"
pass = "<rpcpassword>"

[policy]
# The watchman sweep address(es) (watchmand `sweep_address`). A funding
# output counts as swept only if its spender pays nothing else.
sweep_addresses = ["bcrt1q..."]
grace_blocks = 1008          # blocks after expiry before a payout (7 days)
sweep_min_confs = 100        # depth of the wholesale sweep
max_batch = 100              # claims per tick (and coins per payout tx)
payout_conf_target = 6       # estimatesmartfee target; no estimate, no payout
max_fee_pct_per_payout = 20  # pay on-chain only if the fee share <= 20% of the coin
max_quarantine_per_tick = 10  # circuit breaker
min_payout_sat = 10000        # never pay on-chain below this; smaller coins stay refreshable
